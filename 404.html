<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Richard Raphita Ompusunggu</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#0a1a2f; --blue:#3e7bfa; --blue-l:#6fa0ff; --gold:#e4b15e; --text:#eaf1fa; --muted:#9db2cc; }
    * { margin:0; box-sizing:border-box; }
    body { min-height:100vh; display:grid; place-items:center; text-align:center; padding:24px;
      font-family:"Inter",system-ui,sans-serif; color:var(--text);
      background:radial-gradient(60% 50% at 50% 0%, rgba(62,123,250,0.18), transparent 60%), var(--navy); }
    h1 { font-family:"Outfit",sans-serif; font-size:clamp(4rem,18vw,9rem); font-weight:700; line-height:1;
      background:linear-gradient(120deg,var(--blue-l),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    p { color:var(--muted); margin:14px 0 30px; font-size:1.1rem; }
    a { display:inline-flex; padding:13px 28px; border-radius:999px; background:var(--blue); color:#fff;
      font-family:"Outfit",sans-serif; font-weight:500; text-decoration:none; transition:transform .2s, background .2s; }
    a:hover { transform:translateY(-2px); background:var(--blue-l); }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>This page took a detour. Let's get you back on track.</p>
    <a href="/">Back to portfolio</a>
  </div>
</body>
</html>
